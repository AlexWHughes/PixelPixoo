# Copy to config.yaml and customise for your setup.
# Secrets belong in .env (never commit them): PIXOO_IP, GOOGLE_MAPS_API_KEY, SENSIBO_API_KEY.

pixoo_ip: "192.168.1.50"
rotate_seconds: 18
brightness: 80
enable_f1: true

display:
  text_scale: normal   # tiny | compact | normal | large
  layout: focus        # focus | dense | custom | split | dashboard
  # For custom: row_pattern of 1 (full-width) and 2 (split), e.g. [1, 1, 1, 2]
  # row_pattern: [1, 1, 1, 2]
  # tiles: [weather, sensibo, f1, countdown]
  show_header: true
  show_borders: true
  tiles: []

# Example location: Sydney CBD, Australia
weather:
  latitude: -33.8688
  longitude: 151.2093
  label: "SYD"
  timezone: "Australia/Sydney"
  forecast_days: 5     # 1–7
  show_current: true
  show_forecast: true

f1:
  enabled: true
  mode: next           # next | list
  sessions: [fp1, fp2, fp3, sq, sprint, quali, race]
  show_countdown: true
  show_datetime: true
  show_race_name: true
  show_country: true

traffic:
  routes:
    - name: "WORK"
      origin: "Example St, Suburb NSW 2000"
      destination: "Example Ave, Sydney NSW 2000"

sensibo:
  devices: []          # pin devices in the web UI, or leave empty to auto-discover
  show_temp: true
  show_humidity: true
  show_power: true
  show_mode: true
  show_target: true
  show_room: true

countdown:
  - label: "HOLIDAY"
    at: "2026-12-20T00:00:00+10:00"

# Kerbside bins — tile id `bins` (hidden when nothing is due within lead_days)
bins:
  enabled: false
  timezone: "Australia/Sydney"
  lead_days: 1          # 0 = tonight only; 1 = tonight + tomorrow
  eve_before: true      # TONIGHT = evening before collection morning
  streams:
    - label: LANDFILL
      weekday: wed
      every_weeks: 1
    - label: RECYCLE
      weekday: wed
      every_weeks: 2
      anchor: "2026-01-07"  # a known recycle collection date
    - label: GREEN
      weekday: wed
      every_weeks: 2
      anchor: "2026-01-14"  # opposite fortnight

schedule:
  enabled: false
  timezone: "Australia/Sydney"
  outside: off         # off = turn screen off; pause = leave last frame
  windows:
    - days: [mon, tue, wed, thu, fri]
      start: "07:00"
      end: "22:00"
    - days: [sat, sun]
      start: "09:00"
      end: "23:00"
