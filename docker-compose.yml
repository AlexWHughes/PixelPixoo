services:
  pixelpixoo:
    build: .
    container_name: pixelpixoo
    restart: unless-stopped
    # Secrets: set as Portainer stack env vars (GitHub deploy), or put them in a
    # local .env for compose interpolation. Do not commit .env.
    environment:
      PIXELPIXOO_CONFIG: /config/config.yaml
      PIXELPIXOO_ENV: /config/.env
      PIXOO_IP: ${PIXOO_IP:-}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      SENSIBO_API_KEY: ${SENSIBO_API_KEY:-}
      PIXELPIXOO_PREVIEW: ${PIXELPIXOO_PREVIEW:-}
      PIXELPIXOO_ONCE: ${PIXELPIXOO_ONCE:-}
      PIXELPIXOO_VERBOSE: ${PIXELPIXOO_VERBOSE:-}
      PIXELPIXOO_WEB_HOST: ${PIXELPIXOO_WEB_HOST:-0.0.0.0}
      PIXELPIXOO_WEB_PORT: "8080"
    ports:
      - "${PIXELPIXOO_WEB_PORT:-8787}:8080"
    volumes:
      # Named volumes so GitHub clones don't need gitignored config/.env files
      - pixelpixoo_config:/config
      - pixelpixoo_preview:/preview
    # Host networking can help if Docker bridge cannot reach LAN devices:
    # network_mode: host

volumes:
  pixelpixoo_config:
  pixelpixoo_preview:
