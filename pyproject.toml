[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pixelpixoo"
version = "0.1.0"
description = "Divoom Pixoo 64 push-loop dashboard (weather, traffic, F1, countdown)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27.0",
  "Pillow>=10.0.0",
  "PyYAML>=6.0.1",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
]

[project.scripts]
pixelpixoo = "pixelpixoo.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
