[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pixelpixoo"
version = "0.1.0"
description = "Divoom Pixoo 64 push-loop dashboard with web UI"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28.1",
  "Pillow>=12.3.0",
  "PyYAML>=6.0.3",
  "fastapi>=0.141.1",
  "uvicorn[standard]>=0.52.1",
]

[project.scripts]
pixelpixoo = "pixelpixoo.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
